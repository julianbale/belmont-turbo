name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2   # Dependabot will pin this SHA
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Build check for npm package updates only
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        run: npm ci && npm run build

      # Patch and minor updates — merge automatically if build passed
      - name: Auto-merge patch and minor
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Major updates — build is verified but a human should review before merging
      - name: Flag major update for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "⚠️ **Major version bump** — build passed but manual review required. Check for breaking changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
